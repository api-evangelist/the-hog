method: derived
source: >-
  https://docs.thehog.ai/reference/mcp-tools (published MCP tool list) bound to
  openapi/_original/the-hog-openapi.json operationIds
confidence_note: >-
  The live MCP schema is auth-gated: POST https://mcp.thehog.ai/mcp with
  {"jsonrpc":"2.0","id":1,"method":"tools/list"} returned HTTP 401
  {"error":"Unauthorized"} on 2026-08-14. Tools are therefore mapped by published
  name and documented semantics, not by fetched inputSchema. Bindings marked
  confidence: high are exact name/semantic matches to a single REST operation;
  composite workflow tools are marked medium or low. No tool or operation was
  invented -- every tool name comes from the provider's own MCP tools reference and
  every operationId comes from the captured OpenAPI.

surfaces:
  openapi:
    file: openapi/_original/the-hog-openapi.json
    servers:
      - https://developer.thehog.ai
    gated: false
    operation_count: 52
  mcp:
    url: https://mcp.thehog.ai/mcp
    transport: streamable-http
    gated: true
    gate: OAuth 2.0 (Clerk) -- anonymous tools/list returns 401
    docs: https://docs.thehog.ai/reference/mcp-tools
    local_alternative: npx -y @thehog/mcp@latest (stdio, X-Access-Key/X-Secret-Key)
  graphql:
    present: false
    note: The Hog publishes no GraphQL surface.

