findings:
  - >-
    Roughly half the REST surface (25 of 52 operations) has no MCP tool. The gap is
    concentrated in whole product families: X, Facebook, YouTube, SEO, deepfake
    detection, and every LinkedIn scraper except profile-posts. An agent on the MCP
    surface cannot reach capabilities The Hog sells over REST.
  - >-
    The reverse is not true -- no MCP tool exists without REST backing, so the MCP
    server is a strict (and incomplete) projection of the API rather than a separate
    product.
