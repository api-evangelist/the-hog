management: https://platform.thehog.ai/settings/integrations/mcp
workflow_tools:
- name: build_prospect_list
  description: Search target companies, find relevant people, and optionally enrich contacts.
- name: find_people_at_target_accounts
  description: Find contacts at a known list of company domains or names.
- name: enrich_prospect_list
  description: Enrich a batch of known prospects with requested contact fields or signals.
- name: research_company
  description: Crawl a company site, search recent web results, and run structured deep research.
- name: research_person
  description: Build a structured research dossier for a person or prospect.
- name: monitor_topic
  description: Create monitors for a topic, company, profile, or post, and optionally run them.
- name: analyze_social_profile
  description: Fetch and summarize bounded public Instagram or TikTok profile data.
- name: scrape_and_extract
  description: Scrape one URL and optionally extract structured data with deep research.
