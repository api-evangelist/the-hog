deployment:
  mode: both
  endpoint: https://mcp.thehog.ai/mcp
  install: npx -y @thehog/mcp@latest
  package: https://www.npmjs.com/package/@thehog/mcp
  auth: oauth
  auth_note: >-
    The remote endpoint uses OAuth 2.0 (Clerk, authorization_code + PKCE) -- see
    scopes/the-hog-scopes.yml. The local stdio package authenticates instead with the
    THEHOG_ACCESS_KEY / THEHOG_SECRET_KEY environment variables carrying the same
    dual API-key pair the REST API uses.
  verified: probed
  probe: gated
  probe_detail: >-
    POST https://mcp.thehog.ai/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}
    with Accept: application/json, text/event-stream returned HTTP 401
    {"error":"Unauthorized"} on 2026-08-14. The endpoint is live and reachable; the
    tool schemas require an authenticated introspection. Tool names and semantics are
    taken from the published reference at
    https://docs.thehog.ai/reference/mcp-tools.
  checked: '2026-08-14'
  source: >-
    https://docs.thehog.ai/guides/use-mcp (hosted) and
    https://docs.thehog.ai/guides/local-mcp (stdio); mode corrected from remote to
    both on 2026-08-14 because The Hog ships BOTH a hosted endpoint an agent can POST
    to today AND an npx-installable stdio package.
