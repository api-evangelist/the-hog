              example:
                statusCode: 500
                error: Internal Server Error
                message: An unexpected error occurred.
                path: /api/v1/search
                timestamp: '2026-05-21T09:08:10.000Z'
                requestId: 506af9b3-01a9-43be-9eb4-8458fe3e4f5b
      security:
      - AccessKey: []
        SecretKey: []
      summary: List monitor events
      tags:
      - Monitors
components:
  schemas:
    MonitorResponseDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - linkedin_keyword
          - linkedin_profile
          - linkedin_company
          - linkedin_post
          - instagram_profile
          - instagram_post
          - x_profile
          - x_keyword
          - reddit_keyword
          - reddit_subreddit
          - tiktok_keyword
          - tiktok_hashtag
          - web_search
          - site_search
        status:
          type: string
          enum:
          - active
          - paused
          - disabled
        config:
          type: object
          additionalProperties: true
        cadence_minutes:
          type: number
        last_run_at:
          type: string
          nullable: true
        next_run_at:
          type: string
          nullable: true
        consecutive_failures:
          type: number
        created_at:
          type: string
        updated_at:
          type: string
      required:
      - id
      - name
      - type
      - status
      - config
      - cadence_minutes
      - last_run_at
      - next_run_at
      - consecutive_failures
      - created_at
      - updated_at
    PublicValidationErrorItemDto:
      type: object
      properties:
        property:
          type: string
          example: body.query
        message:
          type: string
          example: query must be a string
        constraints:
          type: object
          additionalProperties:
            type: string
          example:
            isString: query must be a string
      required:
      - property
      - message
    RunNowBodyDto:
      type: object
      properties:
        force_fresh:
          type: boolean
          description: Force a fresh scrape for this run, bypassing cache
    MonitorEventListResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitorEventDto'
        next_cursor:
          type: string
          nullable: true
      required:
      - data
      - next_cursor
    UpdateMonitorDto:
      type: object
      properties:
        name:
          type: string
        config:
          type: object
        cadence_minutes:
          type: number
        max_results:
          type: number
        force_fresh:
          type: boolean
        cache_ttl_days:
          type: number
        status:
          type: string
          enum:
          - active
          - paused
          description: Only active and paused are user-settable
    MonitorListResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonitorResponseDto'
        next_cursor:
          type: string
          nullable: true
      required:
      - data
      - next_cursor
    CreateMonitorDto:
      type: object
      properties:
        name:
          type: string
          description: Human-readable name
          example: Competitor mentions
        type:
          type: string
          description: Monitor type
          enum:
          - linkedin_keyword
          - linkedin_profile
          - linkedin_company
          - linkedin_post
          - instagram_profile
          - instagram_post
          - x_profile
          - x_keyword
          - reddit_keyword
          - reddit_subreddit
          - tiktok_keyword
          - tiktok_hashtag
          - web_search
          - site_search
        config:
          type: object
          description: Type-specific configuration (query, filters, etc.)
          example:
            query: hiring engineers
            max_results: 20
        cadence_minutes:
          type: number
          description: 'Cadence in minutes (minimum 60 for scraper-based types: LinkedIn, Instagram, X, Reddit, TikTok; minimum 15 for web)'
          default: 60
        max_results:
          type: number
          description: Max results per run (1-100)
          default: 10
        force_fresh:
          type: boolean
          description: Force fresh scrape bypassing cache
          default: false
        cache_ttl_days:
          type: number
          description: Cache TTL in days for profile/company monitors (1-90)
          default: 14
        post_url:
          type: string
          description: LinkedIn post URL (required for linkedin_post type)
      required:
      - name
      - type
      - config
    PublicErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        path:
          type: string
          example: /api/v1/search
        requestId:
          type: string
          example: 506af9b3-01a9-43be-9eb4-8458fe3e4f5b
        timestamp:
          type: string
          example: '2026-05-21T09:08:10.000Z'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PublicValidationErrorItemDto'
      required:
      - statusCode
      - error
      - message
      - path
      - timestamp
    MonitorEventDto:
      type: object
      properties:
        id:
          type: string
        monitor_id:
          type: string
        dedup_key:
          type: string
        event_type:
          type: string
        event_json:
          type: object
          additionalProperties: true
        canonical_person_id:
          type: string
          nullable: true
        canonical_company_id:
          type: string
          nullable: true
        detected_at:
          type: string
      required:
      - id
      - monitor_id
      - dedup_key
      - event_type
      - event_json
      - canonical_person_id
      - canonical_company_id
      - detected_at
  securitySchemes:
    AccessKey:
      type: apiKey
      in: header
      name: X-Access-Key
      description: The public API key from the Credentials page.
    SecretKey:
      type: apiKey
      in: header
      name: X-Secret-Key
      description: The API secret shown when the credential is created.
