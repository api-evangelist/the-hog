  /api/v1/monitors/{id}/run-now:
    post:
      description: Trigger a monitor run immediately instead of waiting for its next scheduled time.
      operationId: runMonitorNow
      parameters:
      - name: id
        required: true
        in: path
        description: Monitor ID.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunNowBodyDto'
      responses:
        '202':
          description: Monitor run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorResponseDto'
        '400':
          description: The request body or parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponseDto'
              example:
                statusCode: 400
                error: Bad Request
                message: Validation failed
                path: /api/v1/search
                timestamp: '2026-05-21T09:08:10.000Z'
                requestId: 506af9b3-01a9-43be-9eb4-8458fe3e4f5b
                errors:
                - property: body.query
                  message: query must be a string
                  constraints:
                    isString: query must be a string
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponseDto'
              example:
                statusCode: 401
                error: Unauthorized
                message: Authentication is required.
                path: /api/v1/search
                timestamp: '2026-05-21T09:08:10.000Z'
                requestId: 506af9b3-01a9-43be-9eb4-8458fe3e4f5b
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponseDto'
              example:
                statusCode: 404
                error: Not Found
                message: Resource not found.
                path: /api/v1/search
                timestamp: '2026-05-21T09:08:10.000Z'
                requestId: 506af9b3-01a9-43be-9eb4-8458fe3e4f5b
        '500':
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponseDto'
              example:
                statusCode: 500
                error: Internal Server Error
                message: An unexpected error occurred.
                path: /api/v1/search
                timestamp: '2026-05-21T09:08:10.000Z'
                requestId: 506af9b3-01a9-43be-9eb4-8458fe3e4f5b
      security:
      - AccessKey: []
        SecretKey: []
      summary: Run monitor now
      tags:
      - Monitors
  /api/v1/monitors/{id}/events:
    get:
      description: List events found by a monitor.
      operationId: listMonitorEvents
      parameters:
      - name: since
        required: false
        in: query
        description: ISO timestamp — only return events detected after this time
        schema: {}
      - name: limit
        required: false
        in: query
        schema:
          type: number
      - name: cursor
        required: false
        in: query
        schema: {}
      - name: id
        required: true
        in: path
        description: Monitor ID.
        schema:
          type: string
      responses:
        '200':
          description: Monitor events with pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorEventListResponseDto'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponseDto'
              example:
                statusCode: 401
                error: Unauthorized
                message: Authentication is required.
                path: /api/v1/search
                timestamp: '2026-05-21T09:08:10.000Z'
