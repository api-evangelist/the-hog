          minimum: 1
          maximum: 500
      required:
      - postId
    PlatformInstagramPostDetailsDto:
      type: object
      properties:
        postUrl:
          type: string
          example: https://www.instagram.com/p/ABC123/
      required:
      - postUrl
    PlatformWebScrapeBatchDto:
      type: object
      properties:
        urls:
          description: URLs to scrape using the top-level renderJs and cache freshness options.
          type: array
          items:
            type: string
        items:
          description: Per-item scrape requests. Use either items or urls, not both.
          type: array
          items:
            $ref: '#/components/schemas/PlatformWebScrapeBatchItemDto'
        renderJs:
          type: boolean
          description: Render JavaScript before scraping for urls entries.
          default: false
        maxAgeMs:
          type: number
          minimum: 0
          maximum: 2592000000
          default: 0
        maxAgeDays:
          type: number
          minimum: 0
          maximum: 30
          default: 0
        maxConcurrency:
          type: number
          minimum: 1
          maximum: 10
          default: 3
          description: Maximum number of batch items processed concurrently.
