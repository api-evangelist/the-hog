    PlatformWebCrawlDto:
      type: object
      properties:
        url:
          type: string
          description: Domain or URL to crawl
          example: https://example.com
        limit:
          type: number
          minimum: 1
          maximum: 50
          default: 5
        maxPages:
          type: number
          description: Maximum number of pages to crawl. Overrides limit when set.
          minimum: 1
          maximum: 50
          default: 5
        maxDepth:
          type: number
          description: Maximum link depth from the starting URL.
          minimum: 0
          maximum: 5
          default: 1
        sameDomainOnly:
          type: boolean
          description: Restrict discovered links to the starting hostname.
          default: true
        instructions:
          type: string
          description: Instructions for content extraction
      required:
      - url
    FacebookPageResponseDto:
      type: object
      properties:
        url:
