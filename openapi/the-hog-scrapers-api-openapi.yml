          example: https://example.com/image.jpg
          maxLength: 4096
        image:
          type: string
          format: binary
          description: Multipart image file to analyze. Provide either image or url, not both.
    PlatformWebScrapeJobDto:
      type: object
      properties:
        url:
          type: string
          description: URL to scrape with an async deep browser acquisition job.
          example: https://example.com/page
        formats:
          type: array
          description: Output formats to store on the completed operation. Defaults to ["text", "metadata"]. Request "json" only with jsonSchema.
          default:
          - text
          - metadata
          items:
            type: string
            enum:
            - text
            - markdown
            - html
            - links
            - metadata
            - json
        jsonSchema:
          type: object
          description: JSON Schema used for schema-guided extraction when formats includes "json".
          additionalProperties: true
        instructions:
          type: string
          description: Additional extraction instructions used only when formats includes "json".
          maxLength: 8000
        maxAgeMs:
          type: number
          description: Maximum accepted cache age in milliseconds. Defaults to 0 for deep jobs so dynamic pages are fetched fresh.
          minimum: 0
          maximum: 2592000000
          default: 0
        maxDurationMs:
          type: number
          description: Maximum deep render wall-clock duration in milliseconds.
          minimum: 5000
          maximum: 600000
          default: 120000
        maxScrolls:
          type: number
          description: Maximum viewport scroll steps during deep render.
          minimum: 0
          maximum: 200
          default: 40
        scrollWaitMs:
          type: number
          description: Delay after each deep-render scroll step.
          minimum: 100
          maximum: 5000
          default: 500
        contentStableRounds:
          type: number
          description: Stop after this many consecutive scroll rounds without meaningful content growth.
          minimum: 1
          maximum: 20
          default: 3
        expandClickableContent:
          type: boolean
          description: Click generic visible "load more" or "show more" controls during deep render.
          default: true
        maxExpansionClicks:
          type: number
          description: Maximum generic expansion clicks during deep render.
          minimum: 0
          maximum: 200
          default: 25
      required:
      - url
    LinkedInRepostedByResponseDto:
      type: object
      properties:
        name:
          type: string
        publicIdentifier:
          type: string
      required:
      - name
