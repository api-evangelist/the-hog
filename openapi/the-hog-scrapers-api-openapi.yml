          nullable: true
        pageName:
          type: string
          nullable: true
        pageUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        likesCount:
          type: number
          nullable: true
        followersCount:
          type: number
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
      required:
      - url
      - text
