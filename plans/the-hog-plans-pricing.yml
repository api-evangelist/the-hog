generated: '2026-08-14'
method: searched
source: https://thehog.ai/pricing
docs: https://thehog.ai/pricing
checked: '2026-08-14'
http_status: 200

model: usage-based
model_note: >-
  The Hog publishes no subscription tiers, no seats, and no feature gates. Every
  endpoint is metered at a flat published rate, quoted per 1,000 calls (or per match
  for enrichment). The pricing page states it plainly: "No tiers, no seats, no
  feature gates. Every endpoint is metered at a flat rate."
currency: USD

plan_count: 2
plan_count_note: >-
  Two commercial arrangements exist -- the self-serve metered plan and a
  contact-sales Enterprise arrangement. Neither is a feature tier; the metered rates
  below apply to the self-serve plan.

plans:
  - name: Metered (self-serve)
    price: 0
    price_model: pay-per-call
    currency: USD
    billing_period: monthly
    included_quota:
      calls: 500
      period: month
      scope: all endpoints combined
      note: >-
        "Every account gets 500 calls each month across all endpoints, refreshed
        each cycle -- no credit card required to start building."
      rollover: false
    overage: Metered at the published per-endpoint rates below.
    limits:
      spend_cap: >-
        Customer-set hard monthly limit. "When you reach it we stop the meter, so a
        runaway agent can never overspend."
      volume_discount: >-
        Applied automatically past 100,000 calls per month. No tier to negotiate and
        no plan upgrade required.
      rate_limits_ref: rate-limits/the-hog-rate-limits.yml
    billing_unit: >-
      One request to a metered endpoint is one call. The page states you only pay for
      calls that return successfully.
    signup: https://platform.thehog.ai/

  - name: Enterprise
    price: null
    price_model: contact-sales
    currency: USD
    billing_period: committed-use
    url: https://thehog.ai/enterprise
    included_quota: null
    overage: null
    note: >-
      "For teams with custom data, security, and volume needs." No numbers published.
    includes:
      - Custom data sources and dedicated capacity
      - SSO / SAML and role-based access controls
      - Security review, DPA, and compliance support
      - Committed-use pricing with volume discounts
      - Dedicated support and onboarding
      - Uptime SLAs and priority routing

