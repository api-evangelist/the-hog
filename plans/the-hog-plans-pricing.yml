onboarding:
  self_serve: false
  status: waitlist
  observed: '2026-08-14'
  evidence: >-
    The pricing page and site header both carry "Our beta launch is full. Join the
    waitlist" with a "Join the waitlist" call to action in place of a signup button.
    The developer console at https://platform.thehog.ai/ remains reachable for
    existing accounts, but new self-serve signup is closed as of this check.

reconciliation:
  credits_vs_calls: >-
    The docs meter in "credits" (docs.thehog.ai/concepts/credits, and response fields
    creditsCharged / estimatedMaxCredits / meta.cost), while the public pricing page
    meters in "calls" at dollar rates. The Hog does not publish a credit-to-dollar
    conversion, so the two units cannot be reconciled from public material.
  ref: conventions/the-hog-conventions.yml

free_operations:
  - GET /api/health
  - GET /api/operations/{id}
free_operations_note: >-
  From the docs credits page -- health checks and operation polling are not charged.
  Docs also state re-attaching to an operation with get_operation consumes no extra
  credits.
