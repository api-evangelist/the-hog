oauth_summary:
  issuer: https://clerk.thehog.ai
  authorization_endpoint: https://clerk.thehog.ai/oauth/authorize
  token_endpoint: https://clerk.thehog.ai/oauth/token
  revocation_endpoint: https://clerk.thehog.ai/oauth/token/revoke
  registration_endpoint: https://clerk.thehog.ai/oauth/register
  grant_types_supported: [authorization_code, refresh_token]
  code_challenge_methods_supported: [S256]
  scopes_supported: [openid, profile, email, public_metadata, private_metadata, offline_access, "user:org:read"]
  note: >-
    These are Clerk identity scopes governing the hosted MCP OAuth flow, not The Hog
    REST API authorization scopes (the REST API uses the X-Access-Key/X-Secret-Key key
    pair). Broken out in scopes/the-hog-scopes.yml.
