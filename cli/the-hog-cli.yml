discovery_note: >-
  Not linked from docs.thehog.ai or thehog.ai -- found by enumerating the GitHub
  organization at https://api.github.com/orgs/The-Hog/repos. Two first-party CLIs
  exist and neither is mentioned anywhere on the public documentation site.

clis:
  - name: thehog
    label: The Hog CLI (standalone)
    official: true
    language: go
    go_version_min: '1.26.3'
    license: Apache-2.0
    repo: https://github.com/The-Hog/the-hog-cli
    version: v0.1.0-preview.1
    released: '2026-06-02'
    maturity: preview
    generated_from: >-
      The Hog's public OpenAPI contract, via CLI Printing Press
      (https://github.com/mvanhorn/cli-printing-press). Regeneration is run from the
      the-hog-core-api repo, not by hand-editing generated output.
    binaries:
      - name: thehog
        purpose: terminal CLI for humans and shell-based agents
      - name: thehog-mcp
        purpose: local stdio MCP companion exposing the same generated surface
    install:
      - method: github-release
        detail: >-
          Download the platform archive from
          https://github.com/The-Hog/the-hog-cli/releases, extract, chmod +x, and move
          thehog / thehog-mcp onto PATH. Windows ships .zip archives.
        build: GoReleaser via GitHub Actions on a version tag
      - method: source
        detail: >-
          git clone https://github.com/The-Hog/the-hog-cli.git && go build -o ./thehog
          ./cmd/thehog
    auth:
      env:
        - THE_HOG_ACCESS_KEY
        - THE_HOG_SECRET_KEY
      config_file: ~/.config/thehog/config.toml
      setup_command: thehog auth setup
      verify_command: thehog doctor --json
      base_url_default: https://developer.thehog.ai
      base_url_override_env: THEHOG_BASE_URL

  - name: the-hog
    label: Lightweight CLI bundled with the TypeScript SDK
    official: true
    language: typescript
    license: MIT
    repo: https://github.com/The-Hog/the-hog-sdk-js
    version: 0.1.0
    maturity: unreleased
    install: npx the-hog --help
    note: >-
      Shipped as the "bin" entry of the @the-hog/sdk package, which is not yet
      published to npm (see packages/the-hog-packages.yml). Distinct from and much
      thinner than the Go CLI above.

