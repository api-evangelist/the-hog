  discovery_command:
    command: thehog which "<capability in your own words>"
    behavior: >-
      Resolves a natural-language capability query against a curated feature index.
      Exit 0 = at least one match, exit 2 = no confident match.
  coverage_note: >-
    The Go CLI covers the LinkedIn scrapers that the MCP tool surface omits, but it
    too has no commands for X, Facebook, YouTube, SEO or deepfake detection -- so
    those six REST families are reachable only over raw HTTP.

agent_affordances:
  agent_mode:
    flag: --agent
    expands_to: [--json, --compact, --no-input, --no-color, --yes]
  field_selection:
    flag: --select
    detail: Dotted paths descend into nested structures; arrays traverse element-wise.
  dry_run:
    flag: --dry-run
    detail: Shows the request without sending it -- preview an async search before spending credits.
  async_flags:
    - flag: --wait
      detail: Block until the job reaches a terminal status.
    - flag: --wait-timeout
      default: 10m
    - flag: --wait-interval
      default: 2s
      detail: Exponential backoff up to 30s.
  idempotency_flags:
    - flag: --idempotent
      detail: Treat an already-existing create as success.
    - flag: --ignore-missing
      detail: Treat a missing delete target as success.
  response_envelope:
    shape: '{ meta: { source: live|local, synced_at, reason }, results: <data> }'
    detail: >-
      meta.source declares whether the data came from the API or the local SQLite
      store. Human summary goes to stderr only when stdout is a terminal and no
      machine-format flag is set.
  delivery_sinks:
    flag: --deliver <sink>
    sinks:
      - stdout
      - 'file:<path> (atomic tmp + rename)'
      - 'webhook:<url> (POST application/json, or application/x-ndjson with --compact)'
    note: >-
      This is CLI output routing, not an API webhook surface -- The Hog's API itself
      publishes no webhooks.
  profiles:
    commands: [thehog profile save, thehog profile list, thehog profile show, thehog profile delete]
    precedence: explicit flags > profile values > defaults
    discovery: agent-context lists available_profiles at runtime
  feedback:
    command: thehog feedback "<observation>"
    storage: ~/.local/share/thehog/feedback.jsonl
    transmission: >-
      Local-only by default; POSTed only when THEHOG_FEEDBACK_ENDPOINT is set AND
      --send is passed or THEHOG_FEEDBACK_AUTO_SEND=true.
  offline: sync/search commands can read a local SQLite store when available

related:
