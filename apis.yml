name: The Hog
description: >-
  The Hog is a real-time web intelligence API for AI agents and go-to-market teams,
  founded in 2025 (Y Combinator F25) by Hudson Liao and Paulo Nascimento in San Francisco.
  One credit-based REST API unifies company and people search, contact enrichment,
  LLM-powered deep research, multi-platform web and social scraping (LinkedIn, X, Reddit,
  Instagram, TikTok, YouTube, Facebook), SEO intelligence, and recurring signal monitors.
  Fast calls return synchronously; long-running jobs run asynchronously with polling,
  organization-scoped idempotency keys, cursor pagination, request-id tracing, and a
  consistent JSON error envelope. A hosted OAuth MCP server and a local stdio MCP package
  expose the same capabilities to agents.
